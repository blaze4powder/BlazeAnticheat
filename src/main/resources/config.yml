# Basic settings for the plugin
settings:
  enabled: true
  debug: false
  staff-alerts-only: true
  broadcast-bans: true
  broadcast-mutes: true
  prefix: "&8[&cBlaze&8] "
  menu-watermark: "ᵇˡᵃᶻᵉ ᵃⁿᵗⁱᶜʰᵉᵃᵗ ᵛ¹.⁰"
  dupe-detection: true # this makes it so like if duping should be detected and blocked
  vc-mutes: true # this makes it so like if voice chat mutes should be enabled

# Toggle each command on or off
commands:
  vcmute:
    enabled: true
  vcunmute:
    enabled: true
  stash:
    enabled: true
  wipe:
    enabled: true
    # wipe settings - these make it so like if these things should be wiped
    inventory: true # this makes it so like if player inventory should be cleared
    ender-chest: true # this makes it so like if ender chest should be cleared
    money: false # this makes it so like if money should be wiped (requires vault)
    player-data: false # this makes it so like if player data should be wiped
    position: false # this makes it so like if player should be teleported to spawn
    stats: false # this makes it so like if player stats should be reset
    health: true # this makes it so like if health should be reset
    hunger: true # this makes it so like if hunger should be reset
    experience: true # this makes it so like if experience should be reset
    clear-bans: true # this makes it so like if bans should be cleared
    clear-mutes: true # this makes it so like if mutes should be cleared
    kick-player: true # this makes it so like if player should be kicked
    kick-message: "&cSomething went wrong! Please join back the server" # this makes it so like what message shows when kicked when wiped, default is kinda missleading but yeah
  sus:
    enabled: true
  offend:
    enabled: true
  ban:
    enabled: true
  mute:
    enabled: true
  unban:
    enabled: true
  unmute:
    enabled: true
  reload:
    enabled: true
  poptotem:
    enabled: true
  kbtest:
    enabled: true
  banlist:
    enabled: true
  freeze:
    enabled: true
  unfreeze:
    enabled: true
  susalerts:
    enabled: true
  allmute:
    enabled: true
  allunmute:
    enabled: true

