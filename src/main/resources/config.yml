# Permissions needed for each command
permissions:
  sus: "blaze.sus"
  alerts: "blaze.alerts"
  offend: "blaze.offend"
  ban: "blaze.ban"
  mute: "blaze.mute"
  stash: "blaze.stash"
  reload: "blaze.reload"
  wipe: "blaze.wipe"
  allunmute: "blaze.allunmute"
  vcmute: "blaze.vcmute"
  vcunmute: "blaze.vcunmute"
  allmute: "blaze.allmute"
  unban: "blaze.unban"
  unmute: "blaze.unmute"
  poptotem: "blaze.poptotem"
  kbtest: "blaze.kbtest"
  banlist: "blaze.banlist"
  susalerts: "blaze.susalerts"
  freeze: "blaze.freeze"
  unfreeze: "blaze.unfreeze"

# Ban settings like kick screen
ban:
  enabled: true
  auto-ban: true
  default-time: "7d"
  kick-screen: |
    &c&lBLAZE ANTICHEAT
    
    &fYou have been banned for: &c{reason}
    &fIssued by: &c{admin}
    &fExpires: &c{expires}
    
    &7Appeal at our Discord!

broadcast:
  ban: false
  mute: false
  vcmute: false
  allmute: false
  wipe: false

# all offends in /offend
punishments:
  offenses:
    cheating:
      action: "ban"
      time: "7d"
      wipe: false
    auto_toteming:
      action: "ban"
      time: "7d"
      wipe: false
    macroing:
      action: "ban"
      time: "7d"
      wipe: false # this makes it so like if their player data should be cleaned off the server
    hate_speech:
      action: "vcmute" # this mutes them only on vc
      time: "7d"
      wipe: false
    toxicity:
      action: "mute" # this mutes them in chat
      time: "7d"
      wipe: false
    other:
      action: "allmute" # this mutes them in chat and vc
      time: "7d"
      wipe: false

alerts:
  enabled: true
  play-sound: true
  sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
  format: "&c[Alert] &e{player} &f{check} &c(VL: {vl}) &7{details}"
  ignore-high-ping: true
  ping-threshold: 400
  ignore-frozen: true

# Menu for suspicious players
sus-menu:
  title: "&cSus Players"
  next-page: "&aNext Page"
  previous-page: "&cPrevious Page"
  violations-title: "&cViolations"
  action-menu-title: "&cPlayer Actions"
  teleport-display: "&aTeleport to Player"
  offend-display: "&cOffend Player"
  delete-checks-display: "&4Delete Checks"
  no-violations: "&7No violations recorded"
  refresh-display: "&aRefresh"
  more-display: "&eView All Players"
  all-players-title: "&eAll Players"
  return-display: "&aReturn"

# Menu when someone gets frozen
freeze-menu:
  title: "&c&lYOU HAVE BEEN FROZEN"
  message: "&cYou have been frozen. Join the discord {discord} and join the screenshare voice chat, then wait until an admin moves you."
  discord: "discord.gg/blazepvpclub"
  barrier-display: "&c&lYOU ARE FROZEN"
  barrier-lore:
    - "&cYou cannot move or interact"
    - "&cJoin the discord for screenshare"
    - "&cWait for an admin to unfreeze you"

# Menu for choosing what rule they broke
offense-menu:
  title: "&cSelect Offense"
  next-page: "&aNext Page"
  previous-page: "&cPrevious Page"
  ban-wipe-dye: "RED_DYE"
  ban-no-wipe-dye: "ORANGE_DYE"
  mute-dye: "LIME_DYE"
  per-page: 28

# Settings for generating fake stashes
spawnstash:
  min-width: 5
  max-width: 7
  min-depth: 5
  max-depth: 10
  min-height: 2
  max-height: 4
  floor-materials: "COBBLESTONE,STONE_BRICKS,DIRT,GRASS_BLOCK,OAK_PLANKS"
  wall-materials: "COBBLESTONE,STONE,DIRT,MOSSY_COBBLESTONE"
  chest-materials: "CHEST,TRAPPED_CHEST,BARREL"
  max-chests: 12
  max-spawners: 8
  spawner-types: "ZOMBIE,SKELETON,SPIDER,CREEPER"
